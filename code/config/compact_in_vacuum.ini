[meta]
scenario_name = compact_in_vacuum

[beam]
deuteron_mass_mev = 1875.612
proton_mass_mev = 938.0
kinetic_energy_mev = 380.0

[target]
; [EN] Provisional CH2 target input retained from the legacy count model until the compact target is frozen / [CN] 在紧凑型靶参数冻结前，暂用旧计数模型中的 CH2 靶输入
areal_density_g_per_m2 = 10000.0
molar_mass_g_per_mol = 14.0
avogadro = 6.02214076e23

[run]
beam_current_amp = 1.6e-12
electron_charge_c = 1.602176634e-19
duration_s = 10800.0
duration_s_list = 600.0, 3600.0, 10800.0
single_arm_sector_multiplier = 4.0
lrud_sector_multiplier = 2.0
; [EN] Four opposite-azimuth D-P pairs contribute to each forward/backward pzz count / [CN] 每个前向或后向 pzz 计数由四组方位角相反的 D-P 对贡献
coincidence_sector_multiplier = 4.0
integration_steps = 400

[scan]
polarization_min = 0.0
polarization_max = 1.0
polarization_steps = 10

[coverage]
theta_bins = 360
phi_bins = 360

[data]
observables_dir = ../data/observables
cross_section_file = DSigamaOverDOmega.txt
tensor_file = CompletSetOFT/T.txt
energy_range_file = ../data/energy_lise/H_c8h8_range.txt

[geometry_contract]
source_config = ../../compactInVacuum/config/default_compactInVacuum.yaml
channel_manifest_file = ../../compactInVacuum/compactInVacuum.channel_manifest.json
radius_reference = active_center
active_face_shape = circle
acceptance_model = tangent_rectangle_approximation

[detector_model]
response_status = placeholder
active_medium = undecided
photosensor = undecided
active_diameter_mm = 25.0
active_length_mm = 50.0

[custom_layout]
; [EN] The analytic model uses a 25x25 mm tangent-plane approximation to the circular active face / [CN] 解析模型用 25x25 mm 切平面近似圆形敏感面
proton_theta_lab_deg = 53.4, 11.2
proton_distance_mm = 205.0, 190.0
proton_width_theta_mm = 25.0, 25.0
proton_width_phi_mm = 25.0, 25.0
deuteron_theta_lab_deg = 20.9
deuteron_distance_mm = 140.0
deuteron_width_theta_mm = 25.0
deuteron_width_phi_mm = 25.0

[sekiguchi_layout]
deuteron_theta_lab_deg = 20.1, 22.7, 25.6, 29.3
deuteron_distance_mm = 560.0
deuteron_width_theta_mm = 24.0, 24.0, 24.0, 50.0
deuteron_width_phi_mm = 24.0, 24.0, 24.0, 50.0
proton_theta_lab_deg = 21.3, 26.1, 30.9, 35.8, 40.8, 45.0, 50.8, 55.9
proton_distance_mm = 560.0
proton_width_theta_mm = 20.0
proton_width_phi_mm = 20.0

[energy_loss]
; [EN] Disabled because neither the active medium nor its final thickness has been selected / [CN] 由于敏感材料及最终厚度尚未选定，禁用能损预测
enabled = false
projectile_mass_number = 1
energy_min_mev_per_u = 0.0
energy_max_mev_per_u = 200.0
energy_step_mev_per_u = 1.0
first_scintillator_um = 50000.0
second_scintillator_um = 50000.0
