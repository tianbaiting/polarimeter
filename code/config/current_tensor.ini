[meta]
scenario_name = current_tensor

[beam]
deuteron_mass_mev = 1875.612
proton_mass_mev = 938.0
kinetic_energy_mev = 380.0

[target]
areal_density_g_per_m2 = 10000.0
molar_mass_g_per_mol = 14.0
avogadro = 6.02214076e23

[run]
beam_current_amp = 1.6e-12
electron_charge_c = 1.602176634e-19
duration_s = 10800.0
duration_s_list = 600.0, 3600.0, 10800.0
single_arm_sector_multiplier = 4.0
lrud_sector_multiplier = 2.0
coincidence_sector_multiplier = 4.0
integration_steps = 400

[scan]
polarization_min = -2.0
polarization_max = 1.0
polarization_steps = 30

[coverage]
theta_bins = 720
phi_bins = 720

[data]
observables_dir = ../data/observables
cross_section_file = DSigamaOverDOmega.txt
tensor_file = CompletSetOFT/T.txt
energy_range_file = ../data/energy_lise/H_c8h8_range.txt

[geometry_contract]
source_config = ../../compactInVacuum/config/common_detector.yaml
radius_reference = active_center
active_face_shape = circle
acceptance_model = legacy_top_hat_theta_with_finite_phi_harmonics

[detector_model]
response_status = planned_geometry_provisional_response
active_medium = plastic_scintillator
photosensor = sipm
active_diameter_mm = 20.0
active_length_mm = 5.5

[custom_layout]
; [EN] The response uses a 20x20 mm tangent-plane approximation while retaining finite azimuthal harmonics / [CN] 响应计算采用 20x20 mm 切平面近似，并保留有限方位角谐波积分
proton_theta_lab_deg = 53.4, 11.2
proton_distance_mm = 205.0, 190.0
proton_width_theta_mm = 20.0, 20.0
proton_width_phi_mm = 20.0, 20.0
deuteron_theta_lab_deg = 20.9
deuteron_distance_mm = 140.0
deuteron_width_theta_mm = 20.0
deuteron_width_phi_mm = 20.0

[sekiguchi_layout]
deuteron_theta_lab_deg = 20.1, 22.7, 25.6, 29.3
deuteron_distance_mm = 560.0
deuteron_width_theta_mm = 24.0, 24.0, 24.0, 50.0
deuteron_width_phi_mm = 24.0, 24.0, 24.0, 50.0
proton_theta_lab_deg = 21.3, 26.1, 30.9, 35.8, 40.8, 45.0, 50.8, 55.9
proton_distance_mm = 560.0
proton_width_theta_mm = 20.0
proton_width_phi_mm = 20.0

[energy_loss]
enabled = false
