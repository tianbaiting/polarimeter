schema_version: 3
architecture_mode: compact_one
doc_name: CompactOne

channels:
  - name: deuteron
    particle: deuteron
    cm_branches: [forward, backward]
    angle_deg: 20.9
    radius_mm: 140.0
    confidence: high
  - name: proton_small
    particle: proton
    cm_branches: [backward]
    angle_deg: 11.2
    radius_mm: 190.0
    confidence: medium
  - name: proton_large
    particle: proton
    cm_branches: [forward]
    angle_deg: 53.4
    radius_mm: 205.0
    confidence: medium

sectors: [left, right, up, down]

detector:
  status: provisional
  radius_reference: active_center
  active:
    material: fast_blue_plastic
    material_status: recommended
    diameter_mm: 20.0
    diameter_status: recommended
    thickness_mm: 5.5
    thickness_status: recommended
    thickness_candidates_mm: [5.0, 5.5, 6.0]
  optics:
    coupling: removable_optical_pad_or_dry_interface
    coupling_status: provisional
    coupling_thickness_mm: 0.5
    reflector: unresolved_diffuse_reflector
    reflector_status: placeholder
    reflector_envelope_thickness_mm: 0.25
    collection_efficiency_target: [0.02, 0.05]
    collection_efficiency_status: recommended
  sipm:
    model: NDL EQR15 11-6060D-S
    status: recommended
    active_size_mm: [6.14, 6.14]
    microcell_pitch_um: 15.0
    microcell_count: 167537
    package_envelope_mm: [7.5, 7.5, 1.5]
    alternatives:
      - NDL EQR20 11-6060D-S
      - Hamamatsu S13360-6025CS
  head:
    status: provisional
    carrier_envelope_mm: [14.0, 14.0, 1.2]
    carrier_material: oxygen_free_copper
    carrier_status: provisional
    housing_radial_clearance_mm: 0.25
    shell_wall_mm: 1.0
    shell_material: black_anodized_aluminum_screening
    rear_clearance_mm: 0.0
    rear_cap_wall_mm: 1.0
    mounting_flange_diameter_mm: 27.0
    anti_rotation_feature: rear_flange_d_flat_into_nest_land
    anti_rotation_flat_depth_mm: 1.5
    mounting_datum: rear_mounting_plane_and_anti_rotation_d_flat
    detector_removal_direction: axially_rearward_after_clamp_release
    detector_removal_clearance_mm: 12.0
    cable_exit: axial_rear
    cable_exit_diameter_mm: 5.0
    cable_exit_length_mm: 3.0
    cable_exit_status: provisional
    connector_keepout_diameter_mm: 12.0
    connector_keepout_length_mm: 20.0
    maximum_physical_depth_mm: 18.0

sector_holder:
  status: provisional
  architecture: single_fabricated_three_nest_sector_carrier
  detector_mounts: [deuteron, proton_small, proton_large]
  mounting_datum: chamber_plane_pin_slot_datum
  survey_datums: [primary_plane, radial_pin, clocking_slot]
  chamber_interface: common_plane_pin_slot_interface_block
  detector_removal_direction: detector_axis_rearward_after_clamp_release
  sector_removal_direction: sector_radially_outward
  sector_removal_clearance_mm: 70.0
  carrier_plate_thickness_mm: 6.0
  carrier_web_width_mm: 18.0
  carrier_node_radius_mm: 20.0
  common_bracket_width_mm: 24.0
  nest_axial_depth_mm: 3.0
  nest_radial_wall_mm: 3.0
  nest_clearance_mm: 0.30
  clamp_bridge_thickness_mm: 2.0
  clamp_fastener_class: M3_provisional
  clamp_fastener_clearance_diameter_mm: 3.4
  fastener_status: provisional
  interface_block_mm: [8.0, 40.0, 50.0]
  locating_pin_diameter_mm: 6.0
  locating_slot_width_mm: 6.5
  locating_slot_length_mm: 10.0
  service_lane_offset_mm: 8.0
  acceptance_clearance_mm: 2.0
  tool_clearance_mm: 35.0

physics:
  status: provisional
  scope: tensor_polarimetry_pzz_pyy
  reaction: H1(d,d)p_elastic
  beam:
    particle: deuteron
    kinetic_energy_mev: 380.0
    axis: [0.0, 0.0, 1.0]
  target:
    material: CH2
    areal_density_g_per_m2: 10000.0
    position_mm: [0.0, 0.0, 0.0]
    status: provisional
  coincidence:
    azimuth_relation: opposite
    pairs:
      - name: forward
        deuteron_channel: deuteron
        proton_channel: proton_large
        deuteron_cm_branch: forward
      - name: backward
        deuteron_channel: deuteron
        proton_channel: proton_small
        deuteron_cm_branch: backward
  observables:
    pzz_numerator_pair: forward
    pzz_denominator_pair: backward
    pyy_pair: forward

target:
  status: provisional
  mode: single_rotary
  foil:
    material: CH2
    material_status: provisional
    diameter_mm: 30.0
    thickness_mm: 0.20
    thickness_status: provisional
  holder:
    status: provisional
    architecture: open_c_frame
    outer_width_mm: 58.0
    outer_height_mm: 58.0
    frame_width_mm: 8.0
    thickness_mm: 4.0
    removable: true
    target_center_datum: beam_axis_origin
  rotary:
    status: provisional
    mount_standard: ICF70
    interface_evidence_class: C_engineering_assumption
    site_requirement_status: unresolved_per_deployment
    pivot_mm: [70.0, 0.0, 0.0]
    axis: [0.0, 1.0, 0.0]
    shaft_diameter_mm: 18.0
    arm_length_mm: 70.0
    arm_width_mm: 18.0
    arm_thickness_mm: 8.0
    hub_diameter_mm: 32.0
    hub_thickness_mm: 10.0
    work_angle_deg: 0.0
    park_angle_deg: 90.0
    hard_stop_angles_deg: [0.0, 90.0]
    motion_sample_step_deg: 5.0

services:
  status: provisional
  fast_signal_channels: 12
  coax_impedance_ohm: 50.0
  bias_architecture: external_bias_tee_on_signal_coax
  active_electronics_in_vacuum: false
  signal_feedthrough_count: 4
  channels_per_signal_feedthrough: 4
  signal_interface:
    standard: ICF70
    status: purchased-part-contract
    interface_evidence_class: C_engineering_assumption
    site_requirement_status: unresolved_per_deployment
    supplier: unresolved
    part_number: unresolved
    certified_drawing_reference: unresolved
    dimensions_status: placeholder
    module_outer_diameter_mm: 70.0
    module_inner_diameter_mm: 38.0
    module_thickness_mm: 15.0
    seal_face_width_mm: 8.0
    bolt_circle_diameter_mm: 58.7
    bolt_count: 6
    bolt_hole_diameter_mm: 6.6
    nominal_clear_bore_mm: 38.0
    knife_edge_protected_zone_mm: 8.0
  routing:
    status: provisional
    cable_keepout_diameter_mm: 8.0
    minimum_static_bend_radius_mm: 25.0
    wall_clearance_mm: 20.0
    strain_relief_length_mm: 24.0
    strain_relief_width_mm: 18.0
    strain_relief_thickness_mm: 6.0
    connector_keepout_diameter_mm: 14.0
    connector_keepout_length_mm: 30.0
  grounding:
    status: provisional
    reference: chamber_equipotential_bond
    protective_bond_required: true
    coax_shield_bond_at_feedthrough: true
    signal_shield_is_only_protective_earth: false

thermal:
  status: provisional
  path:
    - sipm_package
    - metallic_sensor_pcb_carrier
    - rear_mounting_face
    - detector_nest
    - sector_carrier_plate
    - chamber_mount_interface
  required_connections:
    - sipm_to_sensor_pcb_carrier
    - sensor_pcb_carrier_to_rear_mounting_face
    - rear_mounting_face_to_detector_nest
    - detector_nest_to_sector_carrier_plate
    - sector_carrier_plate_to_chamber_mount_interface
  spreader_material: oxygen_free_copper
  chamber_sink_interface: sector_holder_plane_pin_slot_mounting_datum
  floating_allowed: false

materials:
  - name: fast_blue_plastic
    density_g_per_cm3: 1.023
    vacuum_compatibility_status: placeholder
    physics_sensitive: true
  - name: unresolved_optical_couplant
    density_g_per_cm3:
    vacuum_compatibility_status: placeholder
    physics_sensitive: true
  - name: unresolved_diffuse_reflector
    density_g_per_cm3:
    vacuum_compatibility_status: placeholder
    physics_sensitive: true
  - name: black_anodized_aluminum_screening
    density_g_per_cm3: 2.70
    vacuum_compatibility_status: provisional
    physics_sensitive: true
  - name: oxygen_free_copper
    density_g_per_cm3: 8.96
    vacuum_compatibility_status: recommended
    physics_sensitive: true
  - name: stainless_304L
    density_g_per_cm3: 7.90
    vacuum_compatibility_status: recommended
    physics_sensitive: true
  - name: aluminum_6061_provisional
    density_g_per_cm3: 2.70
    vacuum_compatibility_status: provisional
    physics_sensitive: false

validation:
  angle_tolerance_deg: 0.05
  radius_tolerance_mm: 0.2
