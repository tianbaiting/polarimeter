channels:
  - name: deuteron
    particle: deuteron
    cm_branches: [forward, backward]
    angle_deg: 20.9
    radius_mm: 140.0
    confidence: high
  - name: proton_small
    particle: proton
    cm_branches: [backward]
    angle_deg: 11.2
    radius_mm: 190.0
    confidence: medium
