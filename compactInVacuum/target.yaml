schema_version: 1
module: compactInVacuum
intent:
  description: 'Legacy numerical CompactInVacuum scaffold retained for reproducible detector-physics and CAD comparison. Its ICF114 beam and ICF70 rotary/service envelopes are engineering reference assumptions, not site requirements for CompactInVacuum-afterSRC or CompactInVacuum-preSAMURAI.'
build:
  config: config/default_compactInVacuum.yaml
  overrides: []
  doc_name: compactInVacuum
  mode: build
validation:
  strict: true
  angle_tolerance_deg: 0.05
  radius_tolerance_mm: 0.2
output:
  output_dir: .
  basename: compactInVacuum
  formats: [fcstd, step]
artifacts:
  report_json: compactInVacuum.validation_report.json
  channel_manifest_json: compactInVacuum.channel_manifest.json
