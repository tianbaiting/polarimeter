schema_version: 1
module: compactOneInfrontSamurai
intent:
  description: CompactInVacuum-preSAMURAI baseline in-vacuum engineering prototype before the SAMURAI terminal; chamber and beamline interfaces remain site-specific and unresolved until supported by approved evidence.
  requirements:
    - selected_maintenance_access=ICF305
    - removable_access_closure_owns_no_detector_support_or_ground
    - four_detailed_modules_on_individually_installable_local_wall_supports
    - all_sector_mounts=radial_plane_pin_slot_with_downstream_retaining_bridges
    - removal_order=right,down,up,left
    - rotary_on_top_signal_feedthroughs_on_left_maintenance_access_on_right
    - initial_support_installation_through_side_access_must_be_verified
    - complete_sector_extraction_motion_must_be_reported_separately
build:
  config: config/infrontSamurai_compact.yaml
  overrides: []
  doc_name: CompactOne_infrontSamurai
  mode: side_access_deployment
validation:
  strict: false
  angle_tolerance_deg: 0.05
  radius_tolerance_mm: 0.2
output:
  output_dir: artifacts/infrontSamurai
  basename: CompactOne_infrontSamurai
  formats: [fcstd, step]
artifacts:
  report_json: artifacts/infrontSamurai/CompactOne_infrontSamurai.validation_report.json
  channel_manifest_json: artifacts/infrontSamurai/CompactOne_infrontSamurai.channel_manifest.json
